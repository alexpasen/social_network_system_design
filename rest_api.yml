openapi: 3.0.0

tags:
  - name: Posts
  - name: Comments
  - name: Likes
  - name: Subscriptions

info:
  title: Traveller API
  description: Current API describes interaction with travelling service.
  version: 1.0.0

paths:
  /users/{id}/posts:
    get:
      summary: Fetch user posts
      description: Method returns user posts
      tags:
        - Posts
      parameters:
        - name: user_id
          in: path
          required: true
          description: Id of the user
          schema:
            type : string
      responses:
        200:
          description: Ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Post"
        404:
          description: Not found
        500:
          description: Server error
    post:
      summary: Create post
      description: Method create traveling post
      tags:
        - Posts
      parameters:
        - name: id
          in: path
          required: true
          description: user id
          schema:
            type : string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostCreate"
            examples:
              request:
                value:
                  message: "Example post message"
                  photo_ids: ["photo1", "photo2", "photo3"]
                  location: { lat: 47.1234, long: 27.4567 }
      responses:
        201:
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        400:
          description: Bad Request
        500:
          description: Server error

  /users/{user_id}/posts/{id}:
    get:
      summary: Fetch user post
      description: Method returns required post
      tags:
        - Posts
      parameters:
        - name: id
          in: path
          required: true
          description: Id of the user post
          schema:
            type : string
        - name: user_id
          in: path
          required: true
          description: Id of the user
          schema:
            type : string
      responses:
        200:
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        404:
          description: Not found
        500:
          description: Server error
    
  /posts/{post_type}:
    get:
      summary: Fetch posts by a specific type (filter)
      description: Method returns posts based on it's type
      tags:
        - Posts
      parameters:
        - name: post_type
          in: path
          required: true
          description: type of the post
          schema:
            type : string
            enum: [all, subscribers, popular]
      responses:
        200:
          description: Ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Post"
        404:
          description: Not found
        500:
          description: Server error

  /posts/{id}/comments:
    post:
      summary: Create post comment
      description: Method redirects to long url by tiny url id
      tags:
        - Comments
      parameters:
        - name: id
          in: path
          required: true
          description: id of the post
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type : object
              properties:
                message:
                  type: string
      responses:
        201:
          description: Created
          content:
            application/json:
              schema: 
                type: object
                properties: 
                  user_id: 
                    type: string
                  post_id:
                    type: string
                  message:
                    type: string
        400:
          description: Bad request
        404:
          description: Not found
        500:
          description: Server error
    get:
      summary: Fetch post comments
      description: Method fethc post comments
      tags:
        - Comments
      parameters:
        - name: id
          in: path
          required: true
          description: id of the post
          schema:
            type: string
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties: 
                    user_id: 
                      type: string
                    post_id:
                      type: string
                    message:
                      type: string
        400:
          description: Bad request
        404:
          description: Not found
        500:
          description: Server error

  /posts/{id}/likes:
    post:
      summary: Like post
      description: Method add 1 like to the post
      tags:
        - Likes
      parameters:
        - name: id
          in: path
          required: true
          description: id of the post
          schema:
            type : string
      responses:
        200:
          description: Ok
        404:
          description: Not found
        500:
          description: Server error

    get:
      summary: Post likes count
      description: Method return amount of likes for the post
      tags:
        - Likes
      parameters:
        - name: id
          in: path
          required: true
          description: id of the post
          schema:
            type : string
      responses:
        200:
          description: Ok
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    count:
                      type: number
                      description: amount of the likes of post     
        404:
          description: Not found
        500:
          description: Server error
  
  /users/{id}/subscribe:
    post:
      summary: Subscibe to user
      description: Methof subscribe current use to require user
      tags:
        - Subscriptions
      parameters:
        - name: id
          in: path
          required: true
          description: id of the user
          schema:
            type : string
      responses:
        200:
          description: Ok
        404:
          description: Not found
        500:
          description: Server error

  /images:
    post:
      summary: Upload image
      description: Upload post image
      tags:
        - Images
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties: 
                image:
                  type: string
                  format: binary
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: upoladed image id
                required:
                  - id
        404:
          description: Not found
        500:
          description: Server error
  
  /images/{id}:
    get:
      summary: Download image
      description: Fetch 
      tags:
        - Images
      parameters:
        - name: id
          in: path
          required: true
          description: id of the user
          schema:
            type : string
      responses:
        200:
          description: Ok
          content:
            image/png:
              schema:
                type: string
                format: binary
        404:
          description: Not found
        500:
          description: Server error
      
components:
  schemas:
    PostCreate:
      type: object
      properties:
        message:
          type: string
          description: post message
        photo_ids:
          type: array
          items:
            type: string
          description: ids of attached photos
        location:
          type: object
          properties:
            lat:
              type: number
              description: latitude
            long:
              type: number
              description: longitude
    Post:
      allOf:
        - type: object
          properties:
            id: 
              type: string
              description: post id
            user_id:
              type: string
              description: if of post creator
        - $ref: "#/components/schemas/PostCreate"

